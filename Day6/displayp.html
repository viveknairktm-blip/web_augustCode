<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myp{
            display: none;
        }


        #ex1{
            color: red;
            display: inline;
            background-color: aqua;
            
        }


        #ex2{
            color: red;
            display: block;
            background-color: aqua;
            
        }
    </style>
</head>
<body>
    <p id="myp">Hello Big Billion Day Sale is Live </p>

    <div>
        This is an example for inline  display
        <p id="ex1"> Hello Inline</p>
    </div>


    
    <div>
        This is an example for block display
        <p id="ex2"> Hello block</p>
    </div>

</body>
</html>
