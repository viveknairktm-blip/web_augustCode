<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav{
            background-color: black;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        
        .menu{
            display: flex;
            gap: 30px;
        }

        a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        a:hover{
            transition: 0.5s;
            /* background-color: palegreen; */
            color: red;
        }
    </style>
</head>
<body>
    <nav>
        <h2 style="color: aquamarine;">Code Acadamy</h2>
        <div class="menu">
            <a href="#menu">Home</a>
            <a href="#menu">Courses</a>
            <a href="#menu">Projects</a>
            <a href="#menu">Login</a>
        </div>
    </nav>
</body>
</html>
