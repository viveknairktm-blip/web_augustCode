<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
            height: 100vh;

           display: grid;
           grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
           gap: 25px;
           flex-wrap: wrap;
        }

        .product{
            border: 1px solid black;
            border-radius: 12px;
            height: 320px;


            margin-bottom: 15px;

            padding: 12px;
            text-align: center;

        box-shadow: 4px  4px  8px  black;
        }


        .product:hover{
            background-color:red;
            transition: 1s;
            transform: scale(1.03);
            color: white;

        }

        .product img{

            width: 300px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;

        }

        .product button{
            background-color: orange;
            border: none;
            border-radius: 12px;
            width: 90%;
        }
        
    </style>
</head>
<body>
    <div class="product">
        <img src="https://images.pexels.com/photos/12920900/pexels-photo-12920900.jpeg" alt="" height="150px" width="150px">
