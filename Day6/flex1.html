<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid black;
            width: 100px;
            height: 100px;
            background-color: red;
            color: white;
            text-align: center;

        }


        .product{
            
            display: flex;
            background-color: aqua;
            height: 500px;

            justify-content: center;

            gap: 40px;

            align-items: center;

            flex-wrap: wrap;

        }
    </style>
</head>
<body>
    <div class="product">
        <div class="box">cake</div>
        <div class="box">cookies</div>
        <div class="box">pastry</div>
    </div>
</body>
</html>
