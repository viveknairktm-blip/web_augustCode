<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: aqua;
            height: 150px;
            width: 300px;
            text-align: center;
            border: 1px solid;

            /* border: 4px double orange; */


            border-radius: 10px;

            margin: 20px;
            padding: 10px;

            /* margin: auto; */

            box-sizing: border-box;

            p{
                /* border-bottom: 1px solid red; */
                 border-bottom: 2px double red;
                 padding-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <p>hello guys</p>
    </div>

    <div class="box">
        <p>Books</p>
    </div>

    
</body>
</html>
